<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy List</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
	<body>
  <main class="page">
    <section class="shopping-list" aria-labelledby="shopping-title">
      <h1 id="shopping-title" class="visually-hidden">Кошик покупок</h1>

<body>
  <main class="page">
    <section class="shopping-list">
      <form class="add-form">
        <input type="text" placeholder="Назва товару" aria-label="Назва товару">
        <button type="submit" class="add-button">Додати</button>
      </form>

      <ul class="products">
        <li class="product-row bought">
          <span class="product-name">Помідори</span>

          <div class="counter">
            <button class="round-button" disabled>−</button>
            <span class="amount">2</span>
            <button class="round-button">+</button>
          </div>

          <div class="actions">
            <button class="status-button">Не куплено</button>
          </div>
        </li>

        <li class="product-row">
          <span class="product-name">Печиво</span>

          <div class="counter">
            <button class="round-button">−</button>
            <span class="amount">2</span>
            <button class="round-button">+</button>
          </div>

          <div class="actions">
            <button class="status-button">Куплено</button>
            <button class="delete-button">×</button>
          </div>
        </li>

        <li class="product-row">
          <input class="edit-input" type="text" value="Сир">

          <div class="counter">
            <button class="round-button" disabled>−</button>
            <span class="amount">1</span>
            <button class="round-button">+</button>
          </div>

          <div class="actions">
            <button class="status-button">Куплено</button>
            <button class="delete-button">×</button>
          </div>
        </li>
      </ul>
    </section>

    <aside class="summary">
      <section class="summary-section">
        <h2>Залишилося</h2>

        <div class="tags">
          <span class="product-item">Печиво <span class="tag-amount">2</span></span>
          <span class="product-item">Сир <span class="tag-amount">1</span></span>
        </div>
      </section>

      <section class="summary-section">
        <h2>Куплено</h2>

        <div class="tags">
          <span class="product-item bought-tag">
            Помідори <span class="tag-amount">2</span>
          </span>
        </div>
      </section>
    </aside>
  </main>

  <aside class="badge">
    <div class="badge-title">Buy List</div>

    <div class="badge-author">
      Created by:<br>
      Maria Soshko
    </div>
  </aside>
</body>
</html>
