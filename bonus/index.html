<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>П'ятнашки</title>

  <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet"/>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>П'ятнашки</h1>
      <p class="desc">Розстав числа від 1 до 15 у правильному порядку</p>
    </header>

    <div class="info-bar">
      <span class="counter">Ходів: <strong id="moves">0</strong></span>
      <button id="shuffleBtn">🔀 Нова гра</button>
    </div>

    <div class="board-area">
      <div id="wdr-component"></div>
    </div>

    <div id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
