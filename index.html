<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy List</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <div class="badge" aria-label="Buy List — created by Maria Soshko">
    <span class="badge__main">Buy List</span>
    <span class="badge__author" aria-hidden="true">
      Created by:<br /><strong>Maria Soshko</strong>
    </span>
  </div>

  <div class="wrapper">

    <section class="col col--list" aria-label="Список товарів">

      <div class="add-form">
        <label for="new-item" class="sr-only">Назва товару</label>
        <input
          id="new-item"
          class="add-form__input"
          type="text"
          placeholder="Назва товару"
          aria-label="Назва товару"
        />
        <button
          class="btn btn--add"
          id="btn-add"
          aria-label="Додати товар"
        >
          Додати
        </button>
      </div>

      <ul class="items-list" id="items-list" aria-label="Список покупок">
      </ul>
    </section>

    <aside class="col col--summary" aria-label="Підсумок">
      <div class="summary-box">
        <h2 class="summary-title">Залишилося</h2>
        <div class="tags" id="tags-remaining" aria-live="polite"></div>
      </div>
      <div class="summary-box">
        <h2 class="summary-title">Куплено</h2>
        <div class="tags" id="tags-bought" aria-live="polite"></div>
      </div>
    </aside>

  </div>

  <script src="main.js"></script>
</body>
</html>
