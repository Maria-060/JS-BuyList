<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy List</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>

  <div class="badge" aria-label="Buy List — created by Maria Soshko">
    <span class="badge__main">Buy List</span>
    <span class="badge__author" aria-hidden="true">
      Created by:<br /><strong>Maria Soshko</strong>
    </span>
  </div>

  <div class="wrapper">

    <section class="col col--list" aria-label="Список товарів">

      <div class="add-form">
        <label for="new-item" class="sr-only">Назва товару</label>
        <input
          id="new-item"
          class="add-form__input"
          type="text"
          placeholder="Назва товару"
          aria-label="Назва товару"
          disabled
        />
        <button
          class="btn btn--add"
          disabled
          aria-label="Додати товар"
        >
          Додати
        </button>
      </div>

      <ul class="items-list" aria-label="Список покупок">

        <li class="item">
          <span class="item__name">Помідори</span>
          <div class="item__counter">
            <button class="btn btn--counter minus" disabled aria-label="Зменшити кількість Помідори">−</button>
            <span class="item__count">2</span>
            <button class="btn btn--counter plus" disabled aria-label="Збільшити кількість Помідори">+</button>
          </div>
          <div class="item__actions">
            <button class="btn btn--bought" disabled aria-label="Позначити як куплене: Помідори" aria-pressed="false">Не куплено</button>
            <button class="btn btn--remove" disabled aria-label="Видалити Помідори">✕</button>
          </div>
        </li>

        <li class="item">
          <span class="item__name is-bought">Печиво</span>
          <div class="item__counter">
            <button class="btn btn--counter minus" disabled aria-label="Зменшити кількість Печиво">−</button>
            <span class="item__count">2</span>
            <button class="btn btn--counter plus" disabled aria-label="Збільшити кількість Печиво">+</button>
          </div>
          <div class="item__actions">
            <button class="btn btn--bought is-bought" disabled aria-label="Відмінити покупку: Печиво" aria-pressed="true">Куплено</button>
            <button class="btn btn--remove" disabled aria-label="Видалити Печиво">✕</button>
          </div>
        </li>

        <li class="item">
          <span class="item__name is-bought">Сир</span>
          <div class="item__counter">
            <button class="btn btn--counter minus" disabled aria-label="Зменшити кількість Сир">−</button>
            <span class="item__count">1</span>
            <button class="btn btn--counter plus" disabled aria-label="Збільшити кількість Сир">+</button>
          </div>
          <div class="item__actions">
            <button class="btn btn--bought is-bought" disabled aria-label="Відмінити покупку: Сир" aria-pressed="true">Куплено</button>
            <button class="btn btn--remove" disabled aria-label="Видалити Сир">✕</button>
          </div>
        </li>

      </ul>
    </section>

    <aside class="col col--summary" aria-label="Підсумок">
      <div class="summary-box">
        <h2 class="summary-title">Залишилося</h2>
        <div class="tags">
          <span class="tag">Помідори <span class="tag__badge">2</span></span>
        </div>
      </div>
      <div class="summary-box">
        <h2 class="summary-title">Куплено</h2>
        <div class="tags">
          <span class="tag">Печиво <span class="tag__badge">2</span></span>
          <span class="tag">Сир <span class="tag__badge">1</span></span>
        </div>
      </div>
    </aside>

  </div>

</body>
</html>
